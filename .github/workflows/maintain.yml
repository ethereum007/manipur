name: Format sources and lock dependencies
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only
      - run: npx --yes prettier@3.6.2 --write 'src/**/*.{ts,tsx,css}' 'tests/*.{ts,mjs}' '*.ts' '*.md' 'scripts/*.mjs'
      - name: Save formatting and dependency lock
        run: |
          git config user.name "Manipur Engineering"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src tests '*.ts' '*.md' 'scripts/*.mjs'
          git diff --cached --quiet || git commit -m "style: format application sources and lock reproducible dependencies"
          git pull --rebase origin main
          git push
