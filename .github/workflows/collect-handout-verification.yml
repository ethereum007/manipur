name: Retain generated handout verification
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: visual-review
          run-id: 40830870881
          github-token: ${{ github.token }}
          path: original
      - name: Retain five reviewed page renders and verification receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('docs/qa/handout-2026-10-29')
          target.mkdir(parents=True,exist_ok=True)
          names=[f'executive-page-{i}.png' for i in range(1,6)]+['executive-brief-verification.json']
          for name in names:
              matches=list(Path('original').rglob(name))
              assert len(matches)==1,(name,len(matches))
              shutil.copyfile(matches[0],target/name)
          PY
          git config user.name 'Mandate Terrain QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qa/handout-2026-10-29
          git diff --cached --quiet || git commit -m 'Retain generated handout page renders and receipt'
          git push origin HEAD:main
