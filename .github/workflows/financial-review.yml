name: Selected primary financial page review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - run: pip install requests pymupdf
      - run: python -u scripts/ingest/review-financial-pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-financial-review
          path: work-financial-review/
          retention-days: 7
