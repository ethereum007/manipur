name: Acquire bounded 2026 official election documents
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.34.2 pymupdf==2.0
      - run: python -u scripts/ingest/acquire-2026-official.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-2026-source-review
          path: work-2026-official/
          retention-days: 7
