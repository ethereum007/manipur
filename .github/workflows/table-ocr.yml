name: Extract election table rows
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  tables:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        document: [assembly-2012, assembly-2022, parliament-2024]
    env:
      OMP_THREAD_LIMIT: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/ingest/fetch_archived.py ${{ matrix.document }}
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - run: pip install pymupdf pillow numpy requests beautifulsoup4
      - run: python -u scripts/ingest/table_ocr.py ${{ matrix.document }}
      - name: Save derived table extracts
        if: always()
        run: |
          git config user.name "Manipur Research Pipeline"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git diff --cached --quiet || git commit -m "data: preserve ${{ matrix.document }} row and header OCR"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 3
          done
