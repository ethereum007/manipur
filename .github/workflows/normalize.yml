name: Normalize and audit election records
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pymupdf
      - run: python -u scripts/ingest/normalize.py
      - name: Preserve the audit
        run: |
          git config user.name "Manipur Research Pipeline"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git diff --cached --quiet || git commit -m "data: preserve normalization audit and source extracts"
          git pull --rebase origin main
          git push
