name: Official affidavit availability audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pymupdf
      - run: python -u scripts/ingest/audit-affidavits.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affidavit-availability
          path: work-affidavits/*.json
          retention-days: 30
