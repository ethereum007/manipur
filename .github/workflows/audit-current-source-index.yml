name: Bounded current official index audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/ingest/audit-current-source-index.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-source-index-audit
          path: current-source-index-audit.json
