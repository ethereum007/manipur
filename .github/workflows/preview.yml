name: Build, browser QA and GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['data/processed/*-pages.json', 'PROGRESS.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: /manipur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure optional custom domain
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            printf 'NEXT_PUBLIC_BASE_PATH=\n' >> "$GITHUB_ENV"
            printf '%s\n' "$CUSTOM_DOMAIN" > public/CNAME
          fi
      - run: pip install requests pyshp shapely
      - run: python scripts/prepare-preview.py
      - run: npm ci
      - run: node scripts/ingest/index-candidates-2022.mjs
      - run: node scripts/validate-data.mjs
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: pip install pymupdf
      - run: python scripts/verify-briefing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: |
            test-results
            playwright-report
            document-review
            out/data/executive-brief.pdf
            data/processed/data-quality.json
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
