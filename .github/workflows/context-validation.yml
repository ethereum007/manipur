name: Historical context benchmark evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/forecast-context.test.mjs
      - run: node scripts/build-context-validation.mjs --output work-context/forecast-context-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-context-evaluation
          path: work-context/
          retention-days: 14
