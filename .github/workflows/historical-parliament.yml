name: Historical Parliamentary source acquisition
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pymupdf
      - run: python -u scripts/ingest/historical-parliament.py
      - name: Archive original sources in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload primary-sources-2026-10-19 work-history/*.zip --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-parliament-review
          path: |
            work-history/manifest.json
            work-history/review/*.png
          retention-days: 7
