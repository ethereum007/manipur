name: Selected financial summary batch thirty-four
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.34.2 pymupdf==2.0
      - run: python -u scripts/ingest/render-financial-selected.py
        env:
          FINANCIAL_TARGETS: data/research/financial-review-targets-batch-thirty-four.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-financial-review-batch-thirty-four
          path: work-financial-review/
          retention-days: 7
