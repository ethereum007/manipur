name: Collect focused cloud visual evidence
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: visual-review
          run-id: 42362633532
          github-token: ${{ github.token }}
          path: original
      - uses: actions/upload-artifact@v4
        with:
          name: consulting-home-focused
          path: |
            original/**/homepage-desktop.png
            original/**/homepage-mobile.png
            original/**/mandate-terrain-preview.png
            original/**/manipur-research-mobile.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain selected verified cloud screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('docs/qa/consulting-home-2026-11-07')
          target.mkdir(parents=True,exist_ok=True)
          names=['homepage-desktop.png','homepage-mobile.png','mandate-terrain-preview.png','manipur-research-mobile.png']
          for name in names:
              matches=list(Path('original').rglob(name))
              assert len(matches)==1, (name,len(matches))
              shutil.copyfile(matches[0],target/name)
          PY
          git config user.name 'Mandate Terrain QA'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qa/consulting-home-2026-11-07
          git diff --cached --quiet || git commit -m 'docs: retain verified consulting homepage screenshots'
          git pull --rebase origin main
          git push origin HEAD:main
