name: Reconcile 2014 combined Parliamentary sheets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.34.2 pymupdf==2.0
      - run: python -u scripts/ingest/reconcile-2014.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parliamentary-2014-reconciliation
          path: work-2014/
          retention-days: 14
