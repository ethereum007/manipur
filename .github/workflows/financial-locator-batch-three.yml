name: Locate bounded financial summary regions batch three
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.34.2 pymupdf==2.0
      - run: python scripts/ingest/locate-financial-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: financial-locator-batch-three
          path: work-financial-locator/
