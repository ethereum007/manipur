name: Review archived 2012 constituency continuity evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.34.2 pymupdf==2.0
      - run: python -u scripts/ingest/review-2012-continuity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assembly-2012-continuity-review
          path: work-2012-acceptance/
          retention-days: 7
