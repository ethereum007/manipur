name: Research acquisition
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - run: pip install requests beautifulsoup4 pymupdf pyshp shapely pillow
      - run: python -u scripts/ingest/cloud_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primary-source-archive
          path: data/raw
          retention-days: 3
      - name: Preserve extracted research in GitHub
        run: |
          git config user.name "Manipur Research Pipeline"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed data/geographic/manipur.json
          git diff --cached --quiet || git commit -m "data: acquire official source extracts and reference constituency geometry"
          git pull --rebase origin main
          git push
